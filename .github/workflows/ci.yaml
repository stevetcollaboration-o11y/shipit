name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - name: install deps
        run: uv sync --frozen
      - name: lint (compile check)
        run: uv run python -m py_compile shipit.py
      - name: run tests
        run: uv run pytest -v
      - name: context tour
        run: |
          echo "sha:    ${{ github.sha }}"
          echo "ref:    ${{ github.ref_name }}"
          echo "event:  ${{ github.event_name }}"
          echo "actor:  ${{ github.actor }}"